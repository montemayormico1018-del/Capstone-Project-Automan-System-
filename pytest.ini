[pytest]
# These four files look like tests (name, location) but aren't safe for
# pytest's default collection:
#   - test_forecast.py / test_trends.py / test_forecast_all.py are manual
#     debug scripts with module-level code that talks to a live Firebase
#     project (test_forecast_all.py also calls a Flask route function
#     outside any request context) -- they have zero `def test_*` functions
#     and previously either broke collection entirely or silently
#     contributed 0 test items. Run them directly with `python <file>.py`
#     if you want their printed output, not via pytest.
#   - scripts/test_login.py makes a real HTTP call at import time, which
#     also aborts collection with no server running.
addopts = --ignore=test_forecast.py --ignore=test_trends.py --ignore=test_forecast_all.py --ignore=scripts/test_login.py -m "not integration"

markers =
    integration: requires a live Firebase project with specific pre-seeded accounts (see the test file's own docstring for which ones). Skipped by default; run explicitly with `pytest -m integration`.
