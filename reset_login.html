<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Demo Accounts - Automan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">Reset Demo Accounts</h3>
                        <p>Click the button below to reset all demo accounts to default passwords.</p>
                        <button onclick="resetAccounts()" class="btn btn-primary">Reset Accounts</button>
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function resetAccounts() {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="alert alert-info">Resetting...</div>';
            
            try {
                const response = await fetch('/api/auth/reset-demo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = '<div class="alert alert-success">Accounts reset! Use these credentials:<br>' +
                        '<strong>Admin:</strong> admin / admin123<br>' +
                        '<strong>Staff:</strong> staff / staff123<br>' +
                        '<strong>Mechanic:</strong> mechanic / mech123<br>' +
                        '<strong>Customer:</strong> customer / cust123</div>';
                } else {
                    result.innerHTML = '<div class="alert alert-danger">Error: ' + (data.error || 'Unknown error') + '</div>';
                }
            } catch (error) {
                result.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            }
        }
    </script>
</body></html>
