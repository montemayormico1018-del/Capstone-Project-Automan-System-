<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already Processed - Automan Car Care</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --info-color: #3b82f6;
            --info-light: #60a5fa;
            --primary: #0f0f10;
            --text-secondary: #4a4a68;
            --title-color: #1e40af;
            --border-radius: 16px;
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        body {
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .info-card {
            max-width: 500px;
            width: 100%;
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            text-align: center;
            padding: 3rem 2rem;
        }
        
        .info-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--info-color), #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            opacity: 0.9;
        }
        
        .info-icon i {
            font-size: 3rem;
            color: white;
        }
        
        h2 {
            font-weight: 700;
            color: var(--title-color);
            margin-bottom: 1rem;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #1e40af;
            margin-bottom: 1.5rem;
        }
        
        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #495057);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 8px;
            margin-top: 1.5rem;
        }
        
        .btn-secondary:hover {
            background: linear-gradient(135deg, #5a6268, #343a40);
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card info-card animate-fade-in">
        <div class="info-icon">
            <i class="bi bi-info-circle-fill"></i>
        </div>
        <h2>Quotation Already Processed</h2>
        <div class="status-badge">{{ appointment.status }}</div>
        <p>This quotation has already been {{ appointment.status.lower() }}.</p>
        <p class="mb-0">If you have any questions, please contact our staff.</p>
        <a href="/" class="btn btn-secondary">
            <i class="bi bi-house me-2"></i>Back to Home
        </a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
