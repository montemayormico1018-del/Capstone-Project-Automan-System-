<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Automan Car Care</title>
    <meta name="theme-color" content="#0f0f10">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <style>
        :root {
            --primary-color: #0f0f10;
            --accent-color: #e53935;
            --secondary-color: #1a1a1d;
            --text-light: #ecf0f1;
            --brand-dark: #0a0a0c;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Manrope', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--brand-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }
        
        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 65.625rem;
            min-height: 37.5rem;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        
        .login-branding {
            flex: 1;
            background: linear-gradient(135deg, var(--brand-dark), var(--primary-color));
            color: white;
            padding: 3.125rem 2.8125rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-branding::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 70%, rgba(229, 57, 53, 0.12) 0%, transparent 50%);
        }
        
        .login-branding::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(229, 57, 53, 0.4), transparent);
        }
        
        .branding-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .branding-title {
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03125rem;
        }
        
        .branding-title span {
            background: linear-gradient(135deg, var(--accent-color), #ff6f60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .branding-subtitle {
            font-size: 1.15rem;
            opacity: 0.9;
            margin-bottom: 2.1875rem;
        }
        
        .branding-features {
            text-align: left;
            margin-top: 1.5625rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--glass-border);
        }
        
        .branding-feature {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 1rem;
            opacity: 0.95;
        }
        
        .branding-feature i {
            font-size: 1.3rem;
            color: var(--accent-color);
        }
        
        .login-form-section {
            flex: 1;
            padding: 3.125rem 3.125rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fafafa;
        }
        
        .form-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.375rem;
        }
        
        .form-subtitle {
            color: #666;
            font-size: 1rem;
            margin-bottom: 1.875rem;
        }
        
        .form-label {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 0.375rem;
            font-size: 0.9rem;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.125rem;
        }
        
        .form-control {
            padding: 0.875rem 0.9375rem 0.875rem 2.8125rem;
            border-radius: 0.625rem;
            border: 2px solid #e0e0e0;
            font-size: 1rem;
            background: white;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(229,57,53,0.15);
            outline: none;
        }
        
        .input-icon {
            position: absolute;
            left: 0.9375rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.1rem;
            z-index: 10;
            pointer-events: none;
        }
        
        .form-control:focus ~ .input-icon {
            color: var(--accent-color);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--accent-color), #c62828);
            border: none;
            padding: 0.9375rem;
            border-radius: 1.5625rem;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(229, 57, 53, 0.35);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(229, 57, 53, 0.45);
            color: white;
        }
        
        .demo-section {
            margin-top: 1.875rem;
            padding-top: 1.375rem;
            border-top: 1px solid #e8e8e8;
        }
        
        .demo-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.875rem;
        }
        
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.625rem;
        }
        
        .demo-btn {
            padding: 0.875rem 0.75rem;
            border-radius: 0.875rem;
            border: 1px solid;
            background: #141416;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #aaa;
        }
        
        .demo-btn i {
            font-size: 1.3rem;
        }
        
        .demo-btn:hover {
            transform: translateY(-3px);
            background: #1f1f22;
            color: white;
        }
        
        .demo-btn.customer { border-color: rgba(229, 57, 53, 0.3); color: var(--accent-color); }
        .demo-btn.customer:hover { background: var(--accent-color); color: white; }
        
        .register-link {
            color: var(--accent-color);
            font-weight: 600;
            text-decoration: none;
        }
        
        .register-link:hover {
            text-decoration: underline;
        }
        
        .alert {
            border-radius: 0.625rem;
            margin-bottom: 1.125rem;
            padding: 0.75rem 0.9375rem;
        }
        
        .text-center {
            margin-top: 1.125rem;
            color: #666;
        }
        
        .navbar-mini {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        
        .navbar-brand-mini {
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        
        .navbar-brand-mini img {
            width: 70px;
        }
        
        @media (max-width: 900px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 30rem;
                min-height: auto;
                margin: 0.625rem;
            }
            
            .login-branding {
                padding: 1.875rem 1.5625rem;
            }
            
            .branding-title {
                font-size: 1.7rem;
            }
            
            .branding-subtitle {
                font-size: 1rem;
            }
            
            .branding-features {
                display: none;
            }
            
            .login-form-section {
                padding: 1.875rem 1.5625rem;
            }
            
            .form-title {
                font-size: 1.5rem;
            }
            
            .demo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            .login-wrapper {
                margin: 0;
                max-width: 100%;
                border-radius: 1rem;
            }
            
            .login-branding {
                padding: 1.5625rem 1.25rem;
            }
            
            .branding-title {
                font-size: 1.5rem;
            }
            
            .login-form-section {
                padding: 1.5625rem 1.25rem;
            }
            
            .form-title {
                font-size: 1.3rem;
            }
            
            .form-control {
                padding: 0.75rem 0.9375rem 0.75rem 2.5rem;
                font-size: 0.95rem;
            }
            
            .input-icon {
                left: 0.75rem;
                font-size: 1rem;
            }
            
            .btn-login {
                padding: 0.75rem;
                font-size: 1rem;
            }
            
            .demo-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
            
            .demo-btn {
                padding: 0.625rem 0.5rem;
                font-size: 0.75rem;
            }
            
            .demo-btn i {
                font-size: 1.1rem;
            }
            
            .text-center {
                margin-top: 1rem;
                font-size: 0.9rem;
            }
        }
        
        /* Prevent horizontal scroll */
        @media (max-width: 576px) {
            html, body {
                overflow-x: hidden;
                max-width: 100vw;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-branding">
            <div class="navbar-mini">
                <a href="/" class="navbar-brand-mini">
                    <img src="{{ url_for('static', filename='images/automan-logo.png') }}" alt="Logo">
                </a>
            </div>
            <div class="branding-content">
                <h1 class="branding-title">Welcome Back</h1>
                <p class="branding-subtitle">Login to access your dashboard</p>
                
                <div class="branding-features">
                    <div class="branding-feature">
                        <i class="bi bi-speedometer2"></i>
                        <span>Quick Service</span>
                    </div>
                    <div class="branding-feature">
                        <i class="bi bi-calendar-check"></i>
                        <span>Easy Scheduling</span>
                    </div>
                    <div class="branding-feature">
                        <i class="bi bi-person-check"></i>
                        <span>Expert Technicians</span>
                    </div>
                    <div class="branding-feature">
                        <i class="bi bi-shield-check"></i>
                        <span>Quality Guaranteed</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="login-form-section">
            <h2 class="form-title">Sign In</h2>
            <p class="form-subtitle">Enter your credentials</p>
            
            <div id="alertContainer"></div>
            
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <input type="text" class="form-control" id="username" placeholder="Enter your username or email" required>
                    <i class="bi bi-person input-icon"></i>
                </div>

                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    <i class="bi bi-lock input-icon"></i>
                </div>
                
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Login
                </button>

                <div class="text-center" style="margin-top: 0.75rem;">
                    <a href="/forgot-password" class="register-link">Forgot password?</a>
                </div>
            </form>

            <div class="demo-section">
                <div class="demo-title">Quick Login</div>
                <div class="demo-grid" id="demoGrid">
                    <button class="demo-btn admin" onclick="demoLogin('admin', 'Admin123!')">
                        <i class="bi bi-shield-lock"></i> Admin
                    </button>
                    <button class="demo-btn staff" onclick="demoLogin('staff', 'Staff123!')">
                        <i class="bi bi-person-badge"></i> Staff
                    </button>
                    <button class="demo-btn mechanic" onclick="demoLogin('mechanic', 'Mechanic123!')">
                        <i class="bi bi-wrench"></i> Mechanic
                    </button>
                    <button class="demo-btn customer" onclick="demoLogin('customer', 'Customer123!')">
                        <i class="bi bi-person"></i> Customer
                    </button>
                </div>
            </div>
            
            <div class="text-center">
                No account? <a href="/register" class="register-link">Register</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
window.addEventListener('load', function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('reason') === 'elsewhere') {
                showAlert('You were logged out because this account was signed in on another device or browser.', 'warning');
            }

            // Hide admin/staff/mechanic buttons when accessing via ngrok
            var currentUrl = window.location.href;
            if (currentUrl.includes('ngrok') || currentUrl.includes('ngrok-free.dev')) {
                var demoGrid = document.getElementById('demoGrid');
                if (demoGrid) {
                    var buttons = demoGrid.querySelectorAll('.demo-btn');
                    // Keep only customer button (index 3)
                    buttons.forEach(function(btn, index) {
                        if (index !== 3) {
                            btn.style.display = 'none';
                        }
                    });
                }
            }
        });
        
        const API_BASE = '/api';
        
        // Check localStorage for existing login
        let existingToken = null;
        try { existingToken = sessionStorage.getItem('token'); } catch(e) {}
        if (existingToken) {
            try {
                let userData = null;
                try { userData = JSON.parse(sessionStorage.getItem('user')); } catch(e) {}
                if (userData && userData.role === 'customer') {
                    window.location.href = '/customer';
                } else {
                    window.location.href = '/dashboard';
                }
            } catch(e) {
                // Continue to login page
            }
        }
        
        function demoLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
            document.getElementById('loginForm').scrollIntoView({behavior: 'smooth'});
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    showAlert(data.error || 'Login failed', 'danger');
                    return;
                }
                
                sessionStorage.setItem('token', data.token || data.access_token);
                if (data.refresh_token) {
                    sessionStorage.setItem('refresh_token', data.refresh_token);
                }
                if (data.session_id) {
                    sessionStorage.setItem('session_id', data.session_id);
                }
                sessionStorage.setItem('user', JSON.stringify(data.user));
                showAlert('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = data.user.role === 'customer' ? '/customer' : '/dashboard';
                }, 1000);
            } catch (error) {
                showAlert('An error occurred', 'danger');
            }
        });
        
        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showAlert(message, type) {
            document.getElementById('alertContainer').innerHTML =
                `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${escapeHtml(message)}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
