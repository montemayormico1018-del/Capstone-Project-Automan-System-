<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Rejected - Automan Car Care</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --danger-color: #ef4444;
            --danger-light: #f87171;
            --primary: #0f0f10;
            --secondary: #e53935;
            --border-radius: 16px;
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        body {
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .reject-card {
            max-width: 500px;
            width: 100%;
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            text-align: center;
            padding: 3rem 2rem;
        }
        
        .reject-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--danger-color), #b91c1c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .reject-icon i {
            font-size: 3rem;
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h2 {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        p {
            color: #4a4a68;
            font-size: 1.05rem;
        }
        
        .contact-note {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            color: #991b1b;
            display: inline-block;
            margin: 1rem 0;
            border: 1px solid #fecaca;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), #b71c1c);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(229,57,53,0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #ef4444, #b71c1c);
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card reject-card animate-fade-in">
        <div class="reject-icon">
            <i class="bi bi-x-circle-fill"></i>
        </div>
        <h2>Quotation Rejected</h2>
        <p>Your quotation has been rejected.</p>
        <div class="contact-note">
            <i class="bi bi-telephone me-2"></i>Our staff will contact you to discuss alternative options.
        </div>
        <p class="mt-4 mb-0">We apologize for any inconvenience.</p>
        <a href="/login" class="btn btn-primary mt-4">
            <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
        </a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
